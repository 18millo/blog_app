{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
  <div class="bg-white rounded-3xl shadow-xl p-8 border border-purple-100">
  {% if form.errors %}
    <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl mb-6 text-sm" role="alert">
      Invalid username or password. Please try again.
    </div>
  {% endif %}
  <h2 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 text-center mb-8">Login</h2>
  <form method="post" action="{% url 'account_login' %}" class="space-y-5">
    {% csrf_token %}
    <div>
    <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
    <input type="text" name="username" id="id_username" required
           class="block w-full px-4 py-3 border-2 border-purple-200 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-all"
           placeholder="username">
    </div>
    <div>
    <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
    <input type="password" name="password" id="id_password" required
           class="block w-full px-4 py-3 border-2 border-purple-200 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-all"
           placeholder="••••••••">
    </div>
    <button type="submit"
            class="w-full bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 hover:from-pink-600 hover:via-purple-600 hover:to-indigo-600 text-white font-semibold py-3 px-6 rounded-xl shadow-lg hover:shadow-xl transition-all">
    Login
    </button>
    <input type="hidden" name="next" value="{{ next }}">
  </form>
  <div class="mt-4 text-center text-sm text-gray-600">
    <a href="{% url 'account_reset_password' %}" class="text-purple-600 hover:text-purple-800 font-medium">Forgot password?</a>
  </div>
  </div>
</div>
{% endblock %}
