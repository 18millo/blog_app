{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
  <div class="bg-white rounded-2xl shadow-xl p-8">
  {% if form.errors %}
    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg mb-6 text-sm" role="alert">
      Invalid username or password. Please try again.
    </div>
  {% endif %}
  <h2 class="text-3xl font-extrabold text-gray-900 text-center mb-8">Login</h2>
  <form method="post" action="{% url 'account_login' %}" class="space-y-5">
    {% csrf_token %}
    <div>
    <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
    <input type="text" name="username" id="id_username" required
           class="block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
    </div>
    <div>
    <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
    <input type="password" name="password" id="id_password" required
           class="block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
    </div>
    <button type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition-colors">
    Login
    </button>
    <input type="hidden" name="next" value="{{ next }}">
  </form>
  <div class="mt-4 text-center text-sm text-gray-600">
    <a href="{% url 'account_reset_password' %}" class="text-indigo-600 hover:text-indigo-800">Forgot password?</a>
  </div>
  </div>
</div>
{% endblock %}
