{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
  <div class="bg-white rounded-3xl shadow-xl p-8 border border-purple-100 text-center">
    <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-gradient-to-br from-green-400 to-emerald-500 flex items-center justify-center">
      <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
      </svg>
    </div>
    <h2 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 mb-4">Password Changed</h2>
    <p class="text-gray-600 mb-6">Your password has been successfully changed.</p>
    <a href="{% url 'account_login' %}"
       class="inline-block bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 hover:from-pink-600 hover:via-purple-600 hover:to-indigo-600 text-white font-semibold py-3 px-6 rounded-xl shadow-lg hover:shadow-xl transition-all">
      Log in here
    </a>
  </div>
</div>
{% endblock %}
