{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
  <div class="bg-white rounded-3xl shadow-xl p-8 border border-purple-100">
    <h2 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 text-center mb-4">Reset Password</h2>
    <p class="text-gray-500 text-center mb-8">Enter your email and we'll send you a reset link.</p>
    
    <form method="post" class="space-y-5">
      {% csrf_token %}
      {% if form.email.errors %}
        <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm mb-4">
          {{ form.email.errors }}
        </div>
      {% endif %}
      
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
        <input type="email" name="email" id="email" required
               class="block w-full px-4 py-3 border-2 border-purple-200 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-all"
               placeholder="you@example.com">
      </div>
      
      <button type="submit"
              class="w-full bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 hover:from-pink-600 hover:via-purple-600 hover:to-indigo-600 text-white font-semibold py-3 px-6 rounded-xl shadow-lg hover:shadow-xl transition-all">
        Reset Password
      </button>
    </form>
  </div>
</div>
{% endblock %}
