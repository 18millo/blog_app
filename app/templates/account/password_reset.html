{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
  <div class="bg-white rounded-2xl shadow-xl p-8">
    <h2 class="text-3xl font-extrabold text-gray-900 text-center mb-4">Reset Password</h2>
    <p class="text-gray-500 text-center mb-8">Enter your email address and we'll send you a link to reset your password.</p>

    <form method="post" action="{% url 'account_reset_password' %}" class="space-y-5">
      {% csrf_token %}

      {% if form.email.errors %}
      <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg text-sm">
        {{ form.email.errors.0 }}
      </div>
      {% endif %}

      <div>
        <label for="id_email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
        <input type="email" name="email" id="id_email" required
               class="block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
               placeholder="you@example.com">
      </div>

      <button type="submit"
              class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition-colors">
        Send Reset Link
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-gray-600">
      <a href="{% url 'account_login' %}" class="text-indigo-600 hover:text-indigo-800 font-medium">Back to login</a>
    </p>
  </div>
</div>
{% endblock %}
