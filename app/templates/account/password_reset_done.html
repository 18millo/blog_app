{% extends "base.html" %}

{% block title %}Email Sent{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
  <div class="bg-white rounded-2xl shadow-xl p-8 text-center">
    <div class="text-green-500 text-5xl mb-4">✓</div>
    <h2 class="text-2xl font-bold text-gray-900 mb-4">Check Your Email</h2>
    <p class="text-gray-600 mb-6">
      We've sent you an email with a link to reset your password. If it doesn't arrive in a few minutes, check your spam folder.
    </p>
    <a href="{% url 'account_login' %}" class="text-indigo-600 hover:text-indigo-800 font-medium">Return to login</a>
  </div>
</div>
{% endblock %}
