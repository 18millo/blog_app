{% extends 'base.html' %}

{% block title %}Contact Us{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
    <div class="bg-white rounded-2xl shadow-xl p-8 md:p-12">
        <h1 class="text-4xl font-extrabold text-gray-900 mb-6">Contact Us</h1>
        <p class="text-lg text-gray-600 leading-relaxed mb-8">
            Hello, {{ name }}! If you have any questions, feel free to reach out to us. We'd love to hear from you.
        </p>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-gray-50 rounded-xl p-6">
                <h3 class="text-xl font-semibold text-gray-800 mb-3">Email</h3>
                <p class="text-gray-600">contact@myblog.com</p>
            </div>
            <div class="bg-gray-50 rounded-xl p-6">
                <h3 class="text-xl font-semibold text-gray-800 mb-3">Location</h3>
                <p class="text-gray-600">123 Blog Street, Internet City</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
