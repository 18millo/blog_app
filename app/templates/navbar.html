<nav class="bg-white bg-opacity-80 backdrop-blur-lg shadow-sm border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <div class="flex items-center space-x-8">
                <a href="/" class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500">MyBlog</a>
                <div class="hidden md:flex space-x-1">
                    <a href="/" class="text-gray-600 hover:text-purple-600 hover:bg-purple-50 px-3 py-2 rounded-lg text-sm font-medium transition-all">Home</a>
                    <a href="/about/" class="text-gray-600 hover:text-purple-600 hover:bg-purple-50 px-3 py-2 rounded-lg text-sm font-medium transition-all">About</a>
                    <a href="/contact/" class="text-gray-600 hover:text-purple-600 hover:bg-purple-50 px-3 py-2 rounded-lg text-sm font-medium transition-all">Contact</a>
                    <a href="/blogs/" class="text-gray-600 hover:text-purple-600 hover:bg-purple-50 px-3 py-2 rounded-lg text-sm font-medium transition-all">Blogs</a>
                    <a href="/subscribe/" class="text-gray-600 hover:text-purple-600 hover:bg-purple-50 px-3 py-2 rounded-lg text-sm font-medium transition-all">Subscribe</a>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                {% if user.is_authenticated %}
                {% if user.is_superuser %}
                <div class="hidden md:flex items-center space-x-1 mr-2">
                    <a href="/admin-panel/" class="text-gray-600 hover:text-purple-600 hover:bg-purple-50 px-3 py-2 rounded-lg text-sm font-medium transition-all">Admin</a>
                </div>
                {% else %}
                {% for g in user.groups.all %}
                {% if g.name == "Admin" %}
                <div class="hidden md:flex items-center space-x-1 mr-2">
                    <a href="/admin-panel/" class="text-gray-600 hover:text-purple-600 hover:bg-purple-50 px-3 py-2 rounded-lg text-sm font-medium transition-all">Admin</a>
                </div>
                {% endif %}
                {% endfor %}
                {% endif %}
                <a href="/add-blog/" class="bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 hover:from-pink-600 hover:via-purple-600 hover:to-indigo-600 text-white px-5 py-2 rounded-lg text-sm font-semibold transition-all shadow-md hover:shadow-lg">
                    + New Post
                </a>
                <a href="/profile/" class="text-gray-600 hover:text-purple-600 px-3 py-2 rounded-lg text-sm font-medium transition-all">Profile</a>
                <form method="post" action="{% url 'account_logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="text-gray-500 hover:text-red-500 px-3 py-2 rounded-lg text-sm font-medium transition-all">Logout</button>
                </form>
                {% else %}
                <a href="{% url 'account_login' %}" class="text-gray-600 hover:text-purple-600 px-4 py-2 rounded-lg text-sm font-medium transition-all">Login</a>
                <a href="{% url 'account_signup' %}" class="bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 hover:from-pink-600 hover:via-purple-600 hover:to-indigo-600 text-white px-5 py-2 rounded-lg text-sm font-semibold transition-all shadow-md hover:shadow-lg">Sign Up</a>
                {% endif %}
            </div>
        </div>
    </div>
</nav>
