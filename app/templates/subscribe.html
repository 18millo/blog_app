{% extends 'base.html' %}

{% block title %}Subscribe{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-white rounded-2xl shadow-xl p-8">
        <h2 class="text-3xl font-extrabold text-gray-900 mb-2 text-center">Stay Updated</h2>
        <p class="text-gray-500 text-center mb-8">Subscribe to our newsletter and never miss a post.</p>

        <form method="post" action="{% url 'subscribe' %}" class="space-y-5">
            {% csrf_token %}
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email address</label>
                <input type="email" id="email" name="email" required
                     class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors"
                     placeholder="you@example.com">
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold shadow-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-colors">
                Subscribe
            </button>
        </form>
    </div>
</div>
{% endblock %}
