{% extends 'base.html' %}

{% block title %}Subscribe{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto px-4 py-20">
    <div class="bg-white rounded-3xl shadow-xl p-8 md:p-10 border border-purple-100">
        <div class="text-center mb-8">
            <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-gradient-to-br from-pink-400 via-purple-400 to-indigo-500 flex items-center justify-center">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 19v-8.93a2 2 0 01.89-1.664l7-4.666a2 2 0 012.22 0l7 4.666A2 2 0 0121 10.07V19M3 19a2 2 0 002 2h14a2 2 0 002-2M3 19l6.75-4.5M21 19l-6.75-4.5M3 10.5l6.75 4.5M21 10.5l-6.75 4.5m-6.75 0l-1.5 1.5m1.5-1.5l1.5-1.5m0 0l1.5 1.5M12 10.5v4.5"/>
                </svg>
            </div>
            <h2 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500">Stay Updated</h2>
            <p class="text-gray-500 mt-3">Subscribe to our newsletter and never miss a post.</p>
        </div>

        <form method="post" action="{% url 'subscribe' %}" class="space-y-5">
            {% csrf_token %}
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email address</label>
                <input type="email" id="email" name="email" required
                     class="mt-1 block w-full px-4 py-3.5 border-2 border-purple-200 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-all"
                     placeholder="you@example.com">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 hover:from-pink-600 hover:via-purple-600 hover:to-indigo-600 text-white py-3.5 rounded-xl font-semibold shadow-lg hover:shadow-xl transition-all">
                Subscribe
            </button>
        </form>
    </div>
</div>
{% endblock %}
